name: Launcher

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'RELEASE.md' # The release validator checks its version header.
  push:
    branches: [main]
    tags: ['v*']
    # Path filters apply to branch pushes, not version tags.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - 'RELEASE.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOMAXPROCS: '2'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  checks:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: launcher-native/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate release metadata and packaging helpers
        shell: bash
        run: |
          python scripts/launcher_release.py
          python scripts/test-ci-packaging.py
          python scripts/test-gameplay-driver.py
      - name: Test launcher with fixture payload
        shell: bash
        run: |
          # Unit tests provide their own payloads. No private build inputs on PRs.
          echo 'Unit tests only, never package this file.' > launcher-native/payload/ci-test.txt
          go -C launcher-native test -p 1 ./...
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: runner.os == 'Linux'
        with:
          dotnet-version: '10.0.x'
      - name: Test multiplayer protocol
        if: runner.os == 'Linux'
        run: dotnet run --project tools/steam-protocol-tests -p:UseSharedCompilation=false

  build:
    name: Build player packages
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: '1.26.x'
          cache: false
      - name: Cache packaging Go dependencies and compiled packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .lab/go-cache
            .lab/go-mod
          key: ${{ runner.os }}-${{ runner.arch }}-packaging-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('launcher-native/go.mod', 'launcher-native/go.sum') }}
      - name: Cache verified packaging downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lab/native-launcher-downloads
          key: packaging-downloads-${{ hashFiles('scripts/package-native-launcher.py', 'scripts/appimage_package.py', 'launcher-native/third-party/source-archives.json') }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate version tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/launcher_release.py --tag "$RELEASE_TAG"
      - name: Install SteamCMD dependencies and Windows icon compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 bubblewrap binutils-mingw-w64-x86-64 desktop-file-utils nsis p7zip-full
      - name: Download supported Root build
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: python scripts/ci_download_game.py --github-hosted
      - name: Generate bindings without launching Root
        run: >-
          python scripts/ci_generate_references.py --github-hosted
          --game .lab/steam-game --manifest .lab/steam-game/steamapps/appmanifest_965580.acf
      - name: Build mod from this commit
        run: dotnet build engine-probe -p:GameDir="$GITHUB_WORKSPACE/.lab/ci-references" -p:UseSharedCompilation=false -m:1
      - name: Package and verify launchers
        run: |
          python scripts/package-native-launcher.py --github-hosted
          python scripts/launcher_release.py --output dist/release-assets
          expected=$(python scripts/launcher_release.py)
          ROOT_APPIMAGE_TEST="$GITHUB_WORKSPACE/dist/RootSixPlayer-$expected-x86_64.AppImage" \
            GOCACHE="$GITHUB_WORKSPACE/.lab/go-cache" GOMODCACHE="$GITHUB_WORKSPACE/.lab/go-mod" \
            go -C launcher-native test -p 1 -run TestPackagedAppImageReplacement -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-${{ github.sha }}
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-package:
    name: Windows installer and update test
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: launcher-native/go.sum
      - name: Install NSIS for installer regression fixtures
        run: choco install nsis --version=3.08 -y --no-progress --allow-downgrade
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launcher-${{ github.sha }}
          path: packages
      - name: Test installation, updates, restart, and uninstall
        shell: pwsh
        run: |
          $version = python scripts/launcher_release.py
          if ($LASTEXITCODE -ne 0) { throw "Release metadata validation failed." }
          ./scripts/test-windows-installer.ps1 -Packages packages -Version $version

  release:
    name: Publish playtest release
    needs: [checks, build, windows-package]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launcher-${{ github.sha }}
          path: packages
      - name: Publish without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "Root Six Player ${RELEASE_TAG#v}" --notes-file RELEASE.md packages/*
